# CI workflow — the committed CI-gates list (FR-22/NFR-Security/NFR-DX):
# typecheck; unit tests; build + bundle isolation + security sweep; FR-12 proof
# trio; FR-21 theme generation + validation; perf budgets as regression
# thresholds; format check.
#
# Lint and the format check run on Node 22 only, not the matrix: ESLint 10's
# supported Node range starts at ^20.19/^22.13, so the lint step cannot run on
# the 18 leg. Typecheck/tests stay on 18/20/22 — the library's engines floor
# (>=18) is untouched, and the whole suite still runs on all three Node lines.
#
# Determinism (FR-1, FR-17, NFR-Determinism) is proven on three runtimes:
# - the WHOLE suite on Node 18/20/22 (job `test`) — same seed ⇒ identical
#   results, including the shared oracle (tests/proofs/determinism-oracle.ts);
# - the oracle's Node-pinned digests plus the pure suites in Chromium (V8),
#   Firefox (SpiderMonkey) and WebKit (JavaScriptCore) via Vitest browser mode
#   (job `browser`, vitest.browser.config.ts). This leg runs src/ transformed
#   by Vite, not the shipped dist/ bundle; Node and Electron run the dist/
#   journeys;
# - the WHOLE suite under Electron's own Node/V8 (job `electron`,
#   pnpm test:electron, ELECTRON_RUN_AS_NODE). Electron's renderer is
#   Chromium, which the Chromium leg covers; no test runs inside an Electron
#   renderer process.
# The README names exactly these legs; tests/proofs/docs-run.test.ts checks
# named README strings and actual run steps, not all prose or remote job results.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck · test + determinism (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        # The loot/equipment journeys read dist/, so the suite needs a fresh build first.
        # Build precedes typecheck too: the dist/-importing journeys fail TS2307 without it.
      - run: pnpm typecheck
      - run: pnpm test
        # Whole suite on all three Node lines = the v1 determinism proof:
        # same seed ⇒ identical results across engines (FR-1).

  lint:
    name: lint · format (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        name: ESLint flat config — hygiene everywhere; the engine security bans on src/
      - run: pnpm format:check
        name: Prettier — the .prettierrc is enforced, not aspirational

  package:
    name: build · bundle isolation · security sweep (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:isolation
        name: runtime-only bundle contains no compiler strings — the runtime surface must not pull in the compiler (FR-22)
      - run: pnpm check:security
        name: no eval/new Function/Math.random/Date.now in src/ + dist/ (NFR-Security belt)
      - run: pnpm exec vitest run tests/proofs/
        name: FR-12 proof trio + perf budgets

  themes:
    name: FR-21 sample themes generate + validate (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/compiler/coverage-floor.test.ts
        name: all three themes to the coverage floor — the FR-21 proof input

  browser:
    name: determinism · browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec vitest run --config vitest.browser.config.ts --browser.name=${{ matrix.browser }}
        name: the Node-pinned oracle digests + pure suites reproduce in a real browser engine (FR-1, NFR-Determinism)

  electron:
    name: determinism · electron runtime (whole suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        # The dist/ journeys run under Electron too, so the suite needs a fresh build first.
      - run: pnpm test:electron
        name: the whole suite under Electron's own Node/V8 (ELECTRON_RUN_AS_NODE)
