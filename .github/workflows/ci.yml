/**
 * CI workflow — architecture.md's CI-gates list (FR-22/NFR-Security/NFR-DX):
 * matrix Node 18/20/22; typecheck; lint (security rules); unit tests; build +
 * bundle isolation + security sweep; FR-12 proof trio; FR-21 theme generation +
 * validation; perf budgets as regression thresholds.
 *
 * The browser determinism matrix (Custom Rule 5) needs a browser-mode Vitest
 * config this repo does not carry in v1 (D4: node env only locally) — the job
 * below runs the determinism suites under the node config on all three Node
 * lines and documents the browser-mode step as the v1.1 follow-up, failing
 * loudly if the config appears and is skipped.
 */
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck · lint · test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vitest run tests/core/rng.test.ts tests/core/tables.test.ts tests/runtime/encounter.test.ts
        name: determinism suites (same-seed ⇒ identical results; browser-mode config = v1.1 follow-up)

  package:
    name: build · bundle isolation · security sweep (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:isolation
        name: runtime-only bundle contains no compiler strings (FR-22, packaging.html's check)
      - run: pnpm check:security
        name: no eval/new Function/Math.random/Date.now in src/ + dist/ (NFR-Security belt)
      - run: pnpm exec vitest run tests/proofs/
        name: FR-12 proof trio + perf budgets

  themes:
    name: FR-21 sample themes generate + validate (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/compiler/coverage-floor.test.ts
        name: both themes to the coverage floor (50 tests) — the proof-4 input