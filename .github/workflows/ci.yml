# CI workflow — the committed CI-gates list (FR-22/NFR-Security/NFR-DX):
# matrix Node 18/20/22; typecheck; lint (security rules); unit tests; build +
# bundle isolation + security sweep; FR-12 proof trio; FR-21 theme generation +
# validation; perf budgets as regression thresholds.
#
# Determinism in v1: the WHOLE suite runs on all three Node lines below —
# same-seed ⇒ identical results is the v1 determinism proof, and a scoped
# rerun of the same tests would prove nothing pnpm test didn't already prove.
# The browser-mode leg (Custom Rule 5, NFR-Determinism's browser/Electron
# clause) is a TRACKED v1.1 follow-up: it needs a browser-mode Vitest config
# this repo does not carry yet (D4: node env locally). When that config lands,
# add the matrix run here — the README already points here for the browser
# leg and names this follow-up, so the doc claim and CI stay one truth.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck · lint · test + determinism (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        # Whole suite on all three Node lines = the v1 determinism proof:
        # same seed ⇒ identical results across engines (FR-1).

  package:
    name: build · bundle isolation · security sweep (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:isolation
        name: runtime-only bundle contains no compiler strings (FR-22, packaging.html's check)
      - run: pnpm check:security
        name: no eval/new Function/Math.random/Date.now in src/ + dist/ (NFR-Security belt)
      - run: pnpm exec vitest run tests/proofs/
        name: FR-12 proof trio + perf budgets

  themes:
    name: FR-21 sample themes generate + validate (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/compiler/coverage-floor.test.ts
        name: both themes to the coverage floor — the FR-21 proof input